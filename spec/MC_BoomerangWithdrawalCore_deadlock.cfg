\* Tiny deadlock-on harness for classifying bounded terminal states.
SPECIFICATION Spec
CHECK_DEADLOCK TRUE

CONSTANTS
  Peers = {P0, P1}
  INITIATOR = P0
  Sessions = {S0}
  ChallengeNonces = {N0, N1, N2, N3}
  PlaceholderIds = {PH0, PH1, PH2, PH3, PH4, PH5, PH6, PH7}
  PSBTs = {PSBT0}
  TXIDs = {TX0}
  BlockHeights = {0, 1, 2, 3, 4}
  InitMystery <- ModelInitMysterySmall
  Milestone0 = 1
  Milestone1 = 4
  NoSession = NoSession
  NoTx = NoTx
  NoPsbt = NoPsbt
  NoMessage = NoMessage
  NoPayload = NoPayload
  NoSigner = NoSigner
  ZeroPad = ZeroPad
  APPROVAL_FRESHNESS = 1
  COMMIT_FRESHNESS = 1
  PING_FRESHNESS = 1
  PONG_FRESHNESS = 1
  MIN_PING_PONG_DISTANCE = 1
  MAX_BLOCK_LAG_JUMP = 1
  TxOfPsbt <- ModelTxOfPsbt

INVARIANTS
  TypeOK
  CounterBounded
  WithdrawalOnlyAfterMilestone0
  UsedSessionsNeverCurrent
  ApprovalsRequireAcceptedTxIdTranscript
  NonInitiatorTxIdPathRequiresLocalPsbtReview
  CommitsRequireAcceptedInitialDuressTranscript
  RecurringChecksRequireAcceptedTranscript
  PendingSTTranscriptsBoundToCurrentSession
  NoStaleSTTranscriptAcceptance
  NonInitiatorCommitsRequireVerifiedInitiatorCommit
  ReadyStatesRequireValidReachedCollection
  AcceptedPlaceholderAcksAreAuthentic
  PlaceholderReplaySuppressionStateSound
  CurrentSessionBindingsFrozen
  SenderFieldsMatchSlots
  UnlockedStateIsClean
  ObservableEnvelopeConsistentUnderPrivateDuress

PROPERTIES
  DeadlockStatesAreClassified
