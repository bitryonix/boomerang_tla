\* After-setup withdrawal-core slice: safety checking through ReadyToSign.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
  Peers = {P0, P1, P2}
  INITIATOR = P0
  ConsentAtoms = {C0, C1, C2}
  PSBTs = {PSBT0}
  TXIDs = {TX0}
  BlockHeights = {0, 1, 2, 3}
  InitBoomerangParams = BP0
  InitBoomerangDescriptor = BD0
  InitMilestoneBlockCollection <- ModelInitMilestoneBlockCollection
  InitDuressConsentSet <- ModelInitDuressConsentSet
  InitDoxingKey <- ModelInitDoxingKey
  InitMystery <- ModelInitMystery
  InitLocalBlockHeight = 0
  InitWTBlockHeight = 0
  NoTx = NoTx
  NoPsbt = NoPsbt
  NoMessage = NoMessage
  NoPlaceholder = NoPlaceholder
  NoSigner = NoSigner
  ZeroPad = ZeroPad
  APPROVAL_FRESHNESS = 2
  COMMIT_FRESHNESS = 2
  PING_FRESHNESS = 2
  PONG_FRESHNESS = 2
  MAX_BLOCK_LAG_JUMP = 1
  TxOfPsbt <- ModelTxOfPsbt

INVARIANTS
  TypeOK
  TxIdFrozen
  NoEarlySigning
  PlaceholderAuthentic
  WTBreakConditionCorrect
  PostDuressNoRevert
  NormalRegimeNonInterference
  ObservationalConsistencySurrogate

PROPERTIES
  ReachedFlagsMonotone
  ReachedCollectionsMonotone
  CounterMonotone
  PingSeqStrictAfterFirst

\* Keep deadlock checking and fairness out of the initial TLC run.
\* The bounded BlockHeights environment can otherwise deadlock on timeout-only stalls
\* before a success-path transition fires; that is a model-bound artifact for this slice.
\* To explore progress later, switch SPECIFICATION to SpecWF on a smaller model.
